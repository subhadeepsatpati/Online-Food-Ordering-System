<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile - FoodExpress</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
        }

        .profile-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #ff5722;
            margin-bottom: 30px;
        }

        .user-info {
            margin-bottom: 25px;
        }

        .user-info p {
            margin: 15px 0;
            font-size: 17px;
        }

        .label {
            font-weight: bold;
        }

        .logout-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #ff5722;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .logout-btn:hover {
            background: #e64a19;
        }

        .home-link {
            display: inline-block;
            margin-left: 10px;
            padding: 12px 25px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="profile-box">

        <h1>My Profile</h1>

        <div class="user-info">

            <p>
                <span class="label">
                    Name:
                </span>

                {{ session["user_name"] }}
            </p>


            <p>
                <span class="label">
                    Email:
                </span>

                {{ session["user_email"] }}
            </p>


            <p>
                <span class="label">
                    User ID:
                </span>

                {{ session["user_id"] }}
            </p>

        </div>


        <a
            href="{{ url_for('logout') }}"
            class="logout-btn"
        >
            Logout
        </a>


        <a
            href="{{ url_for('home') }}"
            class="home-link"
        >
            Home
        </a>

    </div>

</div>

</body>

</html>
