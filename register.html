<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Food Delivery</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">

</head>


<body>


<div class="register-container">

    <div class="register-box">

        <h1>Create Account</h1>

        <p class="subtitle">
            Join our food delivery platform
        </p>


        <!-- ================================= -->
        <!-- FLASH MESSAGES -->
        <!-- ================================= -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- ================================= -->
        <!-- REGISTRATION FORM -->
        <!-- ================================= -->

        <form
            action="{{ url_for('register') }}"
            method="POST"
        >


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="10-digit mobile number"
                    maxlength="10"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a strong password"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <!-- ADDRESS -->

            <div class="form-group">

                <label for="address">
                    Delivery Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    placeholder="Enter your delivery address"
                    rows="4"
                    required
                ></textarea>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="register-btn"
            >
                Create Account
            </button>


        </form>


        <p class="login-link">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>


    </div>

</div>


</body>

</html>
