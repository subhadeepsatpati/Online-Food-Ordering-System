<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - FoodExpress</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">

</head>


<body>


<div class="login-container">

    <div class="login-box">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to your FoodExpress account
        </p>


        <!-- ================================= -->
        <!-- FLASH MESSAGES -->
        <!-- ================================= -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- ================================= -->
        <!-- LOGIN FORM -->
        <!-- ================================= -->

        <form
            action="{{ url_for('login') }}"
            method="POST"
        >


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>


        </form>


        <p class="register-link">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </p>


    </div>

</div>


</body>

</html>
