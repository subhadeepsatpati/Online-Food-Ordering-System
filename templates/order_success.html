<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Placed - FoodExpress</title>

    <style>

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f5f5;
        }

        .container {

            max-width: 600px;

            margin: 100px auto;

            background: white;

            padding: 50px 30px;

            text-align: center;

            border-radius: 15px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.1);
        }

        .success-icon {

            font-size: 65px;

            margin-bottom: 20px;
        }

        h1 {

            color: #28a745;

            margin-bottom: 15px;
        }

        .order-id {

            font-size: 20px;

            font-weight: bold;

            margin: 20px 0;
        }

        p {

            color: #666;

            margin-bottom: 25px;
        }

        .btn {

            display: inline-block;

            padding: 13px 25px;

            background: #ff4d2d;

            color: white;

            text-decoration: none;

            border-radius: 8px;

            margin: 5px;

            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="success-icon">
        ✅
    </div>


    <h1>
        Order Placed Successfully!
    </h1>


    <p>
        Thank you for ordering from FoodExpress.
    </p>


    <div class="order-id">

        Order ID:
        #{{ order_id }}

    </div>


    <p>
        Your food is being prepared.
    </p>


    <a
        href="{{ url_for('home') }}"
        class="btn"
    >
        Back to Home
    </a>


    <a
        href="{{ url_for('restaurants') }}"
        class="btn"
    >
        Order More Food
    </a>

</div>


</body>

</html>
